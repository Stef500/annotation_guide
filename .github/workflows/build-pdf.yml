name: Build PDF

on:
  push:
    branches: [ redaction, main , feature/** ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'draft'
        type: choice
        options:
        - draft
        - final

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    # Make scripts executable
    - name: Setup script permissions
      run: chmod +x scripts/*.sh
    
    # Cache TeX Live installation to speed up builds
    - name: Cache TeX Live
      uses: actions/cache@v4
      id: cache-texlive
      with:
        path: |
          ~/texlive
          /tmp/texlive-installer
        key: texlive-${{ runner.os }}-2025-basic-xelatex-v4-userdir
        restore-keys: |
          texlive-${{ runner.os }}-2025-basic-xelatex-v4-
          texlive-${{ runner.os }}-2025-userdir-
    
    # Cache APT packages
    - name: Cache APT packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: wget perl-modules
        version: 1.0
    
    - name: Install TeX Live with XeLaTeX (auto-detect version)
      if: steps.cache-texlive.outputs.cache-hit != 'true'
      run: |
        echo "🔧 Installing TeX Live from scratch (no cache hit)"
        # Create installer cache directory
        mkdir -p /tmp/texlive-installer
        cd /tmp/texlive-installer
        
        # Install TeX Live
        wget -O install-tl-unx.tar.gz http://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz
        tar -xzf install-tl-unx.tar.gz
        INSTALL_DIR=$(ls -d install-tl-*/ | head -1)
        cd "$INSTALL_DIR"
        
        # Ensure target directory exists before installation
        mkdir -p ~/texlive
        
        # Install minimal TeX Live with XeLaTeX packages to user directory
        cat > texlive.profile <<PROFILE
selected_scheme scheme-basic
TEXDIR ~/texlive
TEXMFCONF ~/texlive/texmf-config
TEXMFVAR ~/texlive/texmf-var
TEXMFHOME ~/texlive/texmf-home
TEXMFLOCAL ~/texlive/texmf-local
PROFILE
        ./install-tl --scheme=basic --no-interaction --profile=texlive.profile
        # Detect installed TeX Live year with better error handling
        TEXLIVE_YEAR=$(ls -1 ~/texlive/ | grep "^20" | head -1)
        if [ -z "$TEXLIVE_YEAR" ]; then
          echo "❌ Error: Could not detect TeX Live installation"
          ls -la ~/texlive/
          exit 1
        fi
        TEXLIVE_BIN="$HOME/texlive/${TEXLIVE_YEAR}/bin/x86_64-linux"
        echo "Detected TeX Live version: $TEXLIVE_YEAR"
        echo "TeX Live binaries path: $TEXLIVE_BIN"
        
        # Verify tlmgr exists before using it
        if [ ! -f "${TEXLIVE_BIN}/tlmgr" ]; then
          echo "❌ Error: tlmgr not found at ${TEXLIVE_BIN}/tlmgr"
          ls -la "${TEXLIVE_BIN}/" || echo "Directory does not exist"
          exit 1
        fi
        
        # Update and install packages in batch for faster installation
        ${TEXLIVE_BIN}/tlmgr update --self
        ${TEXLIVE_BIN}/tlmgr install --no-depends xetex fontspec unicode-math polyglossia biber biblatex fancyhdr lastpage geometry amsmath amsfonts
        echo "✅ TeX Live installation complete"
    
    - name: Setup TeX Live PATH (cached or fresh install)
      run: |
        # Detect installed TeX Live year (consistent with install step)
        TEXLIVE_YEAR=$(ls -1 ~/texlive/ | grep "^20" | head -1)
        if [ -z "$TEXLIVE_YEAR" ]; then
          echo "❌ Error: Could not detect TeX Live installation in setup step"
          ls -la ~/texlive/
          exit 1
        fi
        TEXLIVE_BIN="$HOME/texlive/${TEXLIVE_YEAR}/bin/x86_64-linux"
        echo "Using TeX Live version: $TEXLIVE_YEAR"
        echo "TeX Live binaries path: $TEXLIVE_BIN"
        
        # Verify directory exists
        if [ ! -d "$TEXLIVE_BIN" ]; then
          echo "❌ Error: TeX Live bin directory not found: $TEXLIVE_BIN"
          ls -la "$HOME/texlive/${TEXLIVE_YEAR}/" || echo "TeX Live directory does not exist"
          exit 1
        fi
        
        # Add TeX Live to PATH
        echo "$TEXLIVE_BIN" >> $GITHUB_PATH
        # Verify installation
        echo "🔍 Verifying XeLaTeX installation:"
        ${TEXLIVE_BIN}/xelatex --version | head -3 || echo "XeLaTeX not found"
    
    # Cache LaTeX auxiliary files for faster subsequent builds  
    - name: Cache LaTeX auxiliary files
      uses: actions/cache@v4
      with:
        path: |
          output/*.aux
          output/*.fdb_latexmk
          output/*.fls
          output/*.synctex.gz
        key: latex-aux-${{ runner.os }}-${{ hashFiles('templates/**/*.tex') }}
        restore-keys: |
          latex-aux-${{ runner.os }}-
    
    - name: Prepare output directory
      run: |
        # Create output directory (keep cached aux files)
        mkdir -p output/logs
        echo "📁 Output directory prepared"
        echo "📊 Cache status - TeX Live: ${{ steps.cache-texlive.outputs.cache-hit }}"
    
    - name: Test Pipeline (draft builds)
      if: env.BUILD_TYPE == 'draft'
      run: |
        # Run pipeline tests for draft builds
        ./scripts/test-pipeline.sh 2>&1 | tee output/logs/test.log
        echo "Pipeline test completed"

    - name: Build PDF
      env:
        BUILD_TYPE: ${{ github.event.inputs.build_type || (github.event_name == 'release' && 'final' || 'draft') }}
      run: |
        # Redirect build logs to output/logs
        ./scripts/build.sh 2>&1 | tee output/logs/build.log
    
    - name: Collect build artifacts and logs
      if: always()
      run: |
        # Create build info file
        echo "Build Information:" > output/logs/build-info.txt
        echo "Timestamp: $(date)" >> output/logs/build-info.txt
        echo "Build Type: ${{ env.BUILD_TYPE || 'draft' }}" >> output/logs/build-info.txt
        echo "Branch: ${{ github.ref_name }}" >> output/logs/build-info.txt
        echo "Commit: ${{ github.sha }}" >> output/logs/build-info.txt
        echo "Event: ${{ github.event_name }}" >> output/logs/build-info.txt
        
        # Check LaTeX log for errors
        if [ -f "output/main.log" ]; then
          cp output/main.log output/logs/xelatex.log
          # Extract error summary
          grep -i "error\|warning" output/main.log > output/logs/error-summary.txt || echo "No errors found" > output/logs/error-summary.txt
        fi
        
        # List all output files
        ls -la output/ > output/logs/output-listing.txt || true
    
    - name: Upload build logs (always)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs-${{ github.run_number }}
        path: output/logs/
        retention-days: 30
    
    - name: Prepare versioned artifacts
      if: success() && hashFiles('output/main.pdf')
      run: |
        # Create versioned directory structure
        mkdir -p artifacts/
        
        # Generate version info
        VERSION_INFO="build-${{ github.run_number }}-$(date +%Y%m%d-%H%M%S)"
        BRANCH_CLEAN=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
        
        # Copy PDF with versioned name
        cp output/main.pdf "artifacts/annotation-guide-${BRANCH_CLEAN}-${VERSION_INFO}.pdf"
        cp output/main.pdf "artifacts/annotation-guide-latest.pdf"
        
        # Create version metadata
        cat > artifacts/version-info.json << EOF
        {
          "version": "${VERSION_INFO}",
          "build_number": ${{ github.run_number }},
          "branch": "${{ github.ref_name }}",
          "commit": "${{ github.sha }}",
          "build_type": "${{ env.BUILD_TYPE || 'draft' }}",
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "event": "${{ github.event_name }}",
          "repository": "${{ github.repository }}"
        }
        EOF
        
        echo "VERSION_INFO=${VERSION_INFO}" >> $GITHUB_ENV
        echo "BRANCH_CLEAN=${BRANCH_CLEAN}" >> $GITHUB_ENV
    
    - name: Upload versioned PDF artifacts
      uses: actions/upload-artifact@v4
      if: success() && hashFiles('artifacts/annotation-guide-*.pdf')
      with:
        name: pdf-${{ env.BRANCH_CLEAN }}-${{ env.VERSION_INFO }}
        path: artifacts/
        retention-days: ${{ github.event_name == 'release' && 365 || 90 }}
    
    - name: Upload to release (on release event)
      uses: softprops/action-gh-release@v1
      if: success() && github.event_name == 'release'
      with:
        files: |
          artifacts/annotation-guide-*.pdf
          artifacts/version-info.json
        tag_name: ${{ github.ref_name }}
        name: BRAT Annotation Guide ${{ github.ref_name }}
        body: |
          ## 📄 BRAT Annotation Guide Release
          
          **Build Information:**
          - Build Number: ${{ github.run_number }}
          - Build Type: ${{ env.BUILD_TYPE || 'final' }}
          - Branch: ${{ github.ref_name }}
          - Commit: ${{ github.sha }}
          
          **Files included:**
          - `annotation-guide-*.pdf` - Main annotation guide PDF
          - `version-info.json` - Build metadata
          
          Generated automatically by GitHub Actions.
    
    - name: Build failure notification
      if: failure()
      run: |
        echo "::error title=PDF Build Failed::The LaTeX compilation failed. Check the build logs for details."
        echo "::notice::Build logs are available as artifacts for debugging."
        
        # Create failure summary
        echo "## Build Failure Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Type:** ${{ env.BUILD_TYPE || 'draft' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Timestamp:** $(date)" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "output/logs/error-summary.txt" ]; then
          echo "### LaTeX Errors:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat output/logs/error-summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi