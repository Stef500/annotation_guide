name: Build PDF

on:
  push:
    branches: [ redaction, main, feature/**, better_extract ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'draft'
        type: choice
        options:
        - draft
        - final

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || (github.event_name == 'release' && 'final' || (contains(github.event.head_commit.message, '[FINAL]') && 'final' || 'draft')) }}
    
    steps:
    - uses: actions/checkout@v4
    
    # Make scripts executable
    - name: Setup script permissions
      run: chmod +x scripts/*.sh

    # Restore APT package cache (for fonts) to speed installs
    - name: Restore APT cache (fonts)
      id: apt-cache
      uses: actions/cache@v4
      with:
        path: apt-cache
        key: apt-${{ runner.os }}-fonts-${{ hashFiles('templates/styles/packages.tex') }}

    - name: Seed APT archives from cache
      run: |
        sudo mkdir -p /var/cache/apt/archives
        if [ -d apt-cache ]; then
          sudo cp -a apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
        fi

    # Cache fontconfig cache to avoid reindexing
    - name: Cache fontconfig cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/fontconfig
        key: fontconfig-${{ runner.os }}-v1

    # Install fonts required by XeLaTeX/fontspec (Latin Modern, Liberation)
    - name: Install system fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends fonts-lmodern fonts-liberation fonts-dejavu-core
        fc-cache -f -v

    - name: Save APT cache (fonts)
      if: always()
      run: |
        mkdir -p apt-cache
        cp -a /var/cache/apt/archives/*.deb apt-cache/ 2>/dev/null || true

    # Install biber matching biblatex version used by Tectonic packages
    - name: Install biber 2.17 (compatible)
      run: |
        echo "⬇️ Installing biber 2.17 (compatible with biblatex 3.17)..."
        curl -L -o /tmp/biber.tar.gz \
          https://sourceforge.net/projects/biblatex-biber/files/biblatex-biber/2.17/binaries/Linux/biber-linux_x86_64.tar.gz/download
        tar -xzf /tmp/biber.tar.gz -C /tmp
        sudo mv /tmp/biber /usr/local/bin/biber
        sudo chmod +x /usr/local/bin/biber
        biber --version
    
    # Install Tectonic LaTeX engine
    - name: Install Tectonic
      run: |
        echo "⬇️ Installing Tectonic LaTeX engine..."
        curl -L https://github.com/tectonic-typesetting/tectonic/releases/latest/download/tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
        sudo mv tectonic /usr/local/bin/
        echo "✅ Tectonic installed successfully"
        tectonic --version
    
    # Cache Tectonic packages for faster subsequent builds  
    - name: Cache Tectonic packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/Tectonic
        key: tectonic-packages-${{ runner.os }}-${{ hashFiles('guide/**/*.tex') }}
        restore-keys: |
          tectonic-packages-${{ runner.os }}-
    
    - name: Detect build mode
      run: |
        echo "🔍 Build Mode Detection:"
        echo "  Commit Message: ${{ github.event.head_commit.message }}"
        echo "  Event Type: ${{ github.event_name }}"
        echo "  Manual Input: ${{ github.event.inputs.build_type }}"
        echo "  Final BUILD_TYPE: ${{ env.BUILD_TYPE }}"
        
        if [[ "${{ env.BUILD_TYPE }}" == "final" ]]; then
          echo "✨ FINAL MODE ACTIVATED - Full production build"
        else
          echo "🚧 DRAFT MODE - Fast development build"
        fi
    
    - name: Prepare output directory
      run: |
        # Create output directory (keep cached aux files)
        mkdir -p output/logs
        echo "📁 Output directory prepared"
    
    - name: Test Pipeline (draft builds)
      if: env.BUILD_TYPE == 'draft'
      run: |
        # Run pipeline tests for draft builds
        ./scripts/test-pipeline.sh 2>&1 | tee output/logs/test.log
        echo "Pipeline test completed"

    - name: Build PDF
      run: |
        # Redirect build logs to output/logs
        ./scripts/build.sh 2>&1 | tee output/logs/build.log
    
    - name: Collect build artifacts and logs
      if: always()
      run: |
        # Create build info file
        echo "Build Information:" > output/logs/build-info.txt
        echo "Timestamp: $(date)" >> output/logs/build-info.txt
        echo "Build Type: ${{ env.BUILD_TYPE || 'draft' }}" >> output/logs/build-info.txt
        echo "Branch: ${{ github.ref_name }}" >> output/logs/build-info.txt
        echo "Commit: ${{ github.sha }}" >> output/logs/build-info.txt
        echo "Event: ${{ github.event_name }}" >> output/logs/build-info.txt
        
        # Check Tectonic log for errors
        if [ -f "output/main_guide.log" ]; then
          cp output/main_guide.log output/logs/tectonic.log
          # Extract error summary
          grep -i "error\|warning" output/main_guide.log > output/logs/error-summary.txt || echo "No errors found" > output/logs/error-summary.txt
        fi
        
        # List all output files
        ls -la output/ > output/logs/output-listing.txt || true
    
    - name: Upload build logs (always)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs-${{ github.run_number }}
        path: output/logs/
        retention-days: 30
    
    - name: Prepare versioned artifacts
      if: success() && hashFiles('output/main_guide.pdf')
      run: |
        # Create versioned directory structure
        mkdir -p artifacts/
        
        # Generate version info
        VERSION_INFO="build-${{ github.run_number }}-$(date +%Y%m%d-%H%M%S)"
        BRANCH_CLEAN=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
        
        # Copy PDF with versioned name
        cp output/main_guide.pdf "artifacts/annotation-guide-${BRANCH_CLEAN}-${VERSION_INFO}.pdf"
        cp output/main_guide.pdf "artifacts/annotation-guide-latest.pdf"
        
        # Create version metadata
        cat > artifacts/version-info.json << EOF
        {
          "version": "${VERSION_INFO}",
          "build_number": ${{ github.run_number }},
          "branch": "${{ github.ref_name }}",
          "commit": "${{ github.sha }}",
          "build_type": "${{ env.BUILD_TYPE || 'draft' }}",
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "event": "${{ github.event_name }}",
          "repository": "${{ github.repository }}"
        }
        EOF
        
        echo "VERSION_INFO=${VERSION_INFO}" >> $GITHUB_ENV
        echo "BRANCH_CLEAN=${BRANCH_CLEAN}" >> $GITHUB_ENV
    
    - name: Upload versioned PDF artifacts
      uses: actions/upload-artifact@v4
      if: success() && hashFiles('artifacts/annotation-guide-*.pdf')
      with:
        name: pdf-${{ env.BRANCH_CLEAN }}-${{ env.VERSION_INFO }}
        path: artifacts/
        retention-days: ${{ github.event_name == 'release' && 365 || 90 }}
    
    - name: Upload to release (on release event)
      uses: softprops/action-gh-release@v1
      if: success() && github.event_name == 'release'
      with:
        files: |
          artifacts/annotation-guide-*.pdf
          artifacts/version-info.json
        tag_name: ${{ github.ref_name }}
        name: CU6 Annotation Guide ${{ github.ref_name }}
        body: |
          ## 📄 CU6 Annotation Guide Release
          
          **Build Information:**
          - Build Number: ${{ github.run_number }}
          - Build Type: ${{ env.BUILD_TYPE || 'final' }}
          - Branch: ${{ github.ref_name }}
          - Commit: ${{ github.sha }}
          
          **Files included:**
          - `annotation-guide-*.pdf` - Main annotation guide PDF
          - `version-info.json` - Build metadata
          
          Generated automatically by GitHub Actions.
    
    - name: Build failure notification
      if: failure()
      run: |
        echo "::error title=PDF Build Failed::The LaTeX compilation failed. Check the build logs for details."
        echo "::notice::Build logs are available as artifacts for debugging."
        
        # Create failure summary
        echo "## Build Failure Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Type:** ${{ env.BUILD_TYPE || 'draft' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Timestamp:** $(date)" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "output/logs/error-summary.txt" ]; then
          echo "### LaTeX Errors:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat output/logs/error-summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
