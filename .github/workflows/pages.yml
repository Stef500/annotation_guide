name: Deploy GitHub Pages Dashboard

on:
  push:
    branches: [ main, feature/** ]
    paths:
      - 'docs/dashboard/**'
  workflow_run:
    workflows: ["Build PDF"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # Cache dashboard files for faster builds
    - name: Cache dashboard assets
      uses: actions/cache@v4
      with:
        path: docs/dashboard
        key: dashboard-${{ hashFiles('docs/dashboard/**') }}
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Prepare dashboard files
      run: |
        # Copy dashboard files to _site
        mkdir -p _site
        cp -r docs/dashboard/* _site/
        
        # Update repository info in JavaScript file
        sed -i "s/your-username/${{ github.repository_owner }}/g" _site/dashboard.js
        sed -i "s/annotation_guide/${{ github.event.repository.name }}/g" _site/dashboard.js
        
        echo "Dashboard prepared with repository: ${{ github.repository }}"

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-dashboard
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2